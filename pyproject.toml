[project]
name = "db-assistant"
version = "0.1.0"
description = "How late did this train actually arrive? History-based delay assistant for Deutsche Bahn."
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "polars",
    "lxml",
    "fastapi",
    "uvicorn[standard]",
    "tzdata",
    "curl-cffi>=0.16.3",
]

[project.optional-dependencies]
download = ["huggingface_hub"]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/delay_history", "src/journeys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
